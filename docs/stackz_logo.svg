<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="stackGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0.7" />
    </linearGradient>
  </defs>
  <!-- Background rounded square -->
  <rect x="4" y="4" width="112" height="112" rx="24" fill="url(#grad)" />
  <!-- Stack layers (3 offset rectangles) -->
  <rect x="28" y="26" width="64" height="44" rx="6" fill="none" stroke="url(#stackGrad)" stroke-width="3.5" opacity="0.4" />
  <rect x="24" y="36" width="64" height="44" rx="6" fill="none" stroke="url(#stackGrad)" stroke-width="3.5" opacity="0.6" />
  <rect x="20" y="46" width="64" height="44" rx="6" fill="url(#stackGrad)" fill-opacity="0.15" stroke="url(#stackGrad)" stroke-width="3.5" opacity="0.9" />
  <!-- Divider line in front card -->
  <line x1="52" y1="50" x2="52" y2="86" stroke="url(#stackGrad)" stroke-width="2" opacity="0.5" />
  <!-- Letter S -->
  <text x="60" y="106" font-family="-apple-system, SF Pro Display, Helvetica Neue, sans-serif" font-size="16" font-weight="700" fill="white" fill-opacity="0.9" text-anchor="middle" letter-spacing="3">STACKZ</text>
</svg>
